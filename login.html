<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Zee Job Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

  <div class="navbar" id="navBar">
    <div class="logo">
      <h1>Zee-Job portal</h1>
    </div>
    <ul>
      <li><a href="index.html">Find Job</a></li>
      <li><a href="about.html">Why Zee</a></li>
      <li><a href="admin.html">Admin desk</a></li>
      <li><a href="login.html">Login</a></li>
      <li id="authAreaItem"><span id="authArea"></span></li>
    </ul>
  </div>

  <div class="auth-wrap">
    <div class="auth-box">
      <h2>Welcome to Zee</h2>

      <!-- candidate ya admin -->
      <div class="tabs">
        <button class="tab-btn active" id="roleCandidate" type="button">👤 Candidate</button>
        <button class="tab-btn" id="roleAdmin" type="button">🛡 Admin</button>
      </div>

      <!-- login ya signup -->
      <div class="tabs">
        <button class="tab-btn active" id="tabLogin" type="button">Login</button>
        <button class="tab-btn" id="tabSignup" type="button">Sign up</button>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" required autocomplete="current-password">
        </div>
        <button type="submit" class="auth-submit" id="loginBtn">Log in</button>
      </form>

      <form id="signupForm" style="display:none;">
        <div class="form-group">
          <label for="suName">Full name</label>
          <input type="text" id="suName" required autocomplete="name">
        </div>
        <div class="form-group">
          <label for="suEmail">Email</label>
          <input type="email" id="suEmail" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="suPassword">Password</label>
          <input type="password" id="suPassword" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="auth-submit" id="signupBtn">Create candidate account</button>
      </form>

      <div id="authMsg" class="auth-msg"></div>

      <div class="hint" id="hintText"></div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
